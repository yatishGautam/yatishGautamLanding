name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  BUCKET: yatishgautam.com
  DISTRIBUTION_ID: E1QKUAQ05JBNVV
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::886436936089:role/github-deploy-yatishgautam-com
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync assets (long cache)
        run: |
          aws s3 sync site/ "s3://$BUCKET" \
            --delete \
            --exclude "*.html" --exclude "robots.txt" \
            --cache-control "public,max-age=86400"

      - name: Sync HTML (short cache)
        run: |
          aws s3 sync site/ "s3://$BUCKET" \
            --exclude "*" --include "*.html" --include "robots.txt" \
            --cache-control "public,max-age=300,must-revalidate"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
